name: 自检与语法检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl, curl, gd, fileinfo, pdo_sqlite
          coverage: none

      - name: 对全部 PHP 文件执行 php -l
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! out=$(php -l "$f" 2>&1); then
              echo "$out"
              fail=1
            fi
          done < <(find . -path ./.git -prune -o -name '*.php' -print0)
          if [ "$fail" -eq 0 ]; then
            echo "全部 PHP 文件语法检查通过"
          fi
          exit $fail

  selftest:
    name: 端到端自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl, curl, gd, fileinfo, pdo_sqlite
          coverage: none

      - name: 确认扩展可用
        run: |
          php -m > ext.txt
          for e in pdo_sqlite mbstring openssl curl gd fileinfo; do
            if grep -qix "$e" ext.txt; then
              echo "$e  OK"
            else
              echo "$e  MISSING"
              exit 1
            fi
          done

      - name: 运行 tools/selftest.php
        run: |
          php tools/selftest.php

      - name: 清理自检临时库
        if: always()
        run: rm -f runtime/selftest_*.db
