name: 自检与语法检查

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl, curl, gd, fileinfo, pdo_sqlite
          coverage: none

      - name: 对全部 PHP 文件执行 php -l
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; fail=1; }
          done < <(find . -path ./.git -prune -o -name '*.php' -print0)
          [ "$fail" -eq 0 ] && echo "全部 PHP 文件语法检查通过"
          exit $fail

  selftest:
    name: 端到端自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, openssl, curl, gd, fileinfo, pdo_sqlite
          coverage: none

      - name: 确认 CLI 扩展可用
        run: php -r "foreach (['pdo_sqlite','mbstring','openssl','curl','gd','fileinfo'] as \$e) { printf(\"%-12s %s\n\", \$e, extension_loaded(\$e) ? 'OK' : 'MISSING'); }"

      - name: 运行 tools/selftest.php
        run: php tools/selftest.php

      - name: 清理自检临时库
        if: always()
        run: rm -f runtime/selftest_*.db
