<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - 页面不存在</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { --ink:#1f2733; --muted:#7d8799; --line:#e4e8f0; --primary:#1c7ed6; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 30px;
    font: 14px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink); background: linear-gradient(135deg, #eef3fb, #dfe8f7);
  }
  .box {
    width: 100%; max-width: 520px; background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 38px 32px; text-align: center;
    box-shadow: 0 12px 40px rgba(23,31,48,.10);
  }
  .code { font-size: 56px; font-weight: 700; letter-spacing: -0.03em;
          background: linear-gradient(135deg,#4dabf7,#3b5bdb); -webkit-background-clip: text;
          background-clip: text; color: transparent; line-height: 1.1; }
  h1 { font-size: 18px; margin: 6px 0 10px; }
  p { color: var(--muted); margin: 0 0 22px; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-block; padding: 9px 18px; border-radius: 8px; text-decoration: none; font-size: 13.5px; }
  a.primary { background: var(--primary); color: #fff; }
  a.ghost { border: 1px solid var(--line); color: #33405c; }
  a:hover { filter: brightness(.96); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>页面不存在或已被移除</h1>
    <p>请检查地址是否正确，或从下方入口继续访问。</p>
    <div class="actions">
      <a class="btn primary" href="/">返回首页</a>
      <a class="btn ghost" href="/store/index.php">应用商店</a>
      <a class="btn ghost" href="/user/index.php">用户中心</a>
    </div>
  </div>
</body>
</html>
